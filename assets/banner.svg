<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Carlos Ferreira - All Things Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <style>
      .name { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c0caf5; }
      .tag  { font: 500 22px 'Consolas', 'Courier New', monospace; fill: #7aa2f7; letter-spacing: 2px; }
      .cursor { fill: #7dcfff; }
    </style>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- layered animated waves -->
  <g fill="none" stroke-width="2">
    <path stroke="url(#accent)" opacity="0.18"
      d="M0,190 C150,160 300,220 450,190 C600,160 750,220 900,190 C1050,160 1200,220 1350,190">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path stroke="url(#accent)" opacity="0.30"
      d="M0,205 C150,175 300,235 450,205 C600,175 750,235 900,205 C1050,175 1200,235 1350,205">
      <animateTransform attributeName="transform" type="translate" from="-225 0" to="-675 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <g transform="translate(60,0)">
    <text class="name" x="0" y="120">Carlos Ferreira</text>
    <text class="tag" transform="translate(2,158)" x="0" y="0">All Things Developer<tspan class="cursor" dx="6">&#9608;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
